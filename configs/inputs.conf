# Splunk Universal Forwarder - Windows endpoint inputs
# Location: C:\Program Files\SplunkUniversalForwarder\etc\system\local\inputs.conf
# Forwards to: 192.168.10.10:9997 (set during forwarder install)

[WinEventLog://Security]
disabled = 0
index = wineventlog

[WinEventLog://System]
disabled = 0
index = wineventlog

[WinEventLog://Application]
disabled = 0
index = wineventlog

[WinEventLog://Microsoft-Windows-PowerShell/Operational]
disabled = 0
index = wineventlog

[WinEventLog://Microsoft-Windows-Sysmon/Operational]
disabled = 0
index = sysmon
